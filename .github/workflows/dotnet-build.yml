name: .NET build

on:
  push:
    branches:
      - main
      - experimental/unit-development-terrain-data-refactor
      - feature/unit-navigation-800-battle
  pull_request:
    branches:
      - main
      - experimental/unit-development-terrain-data-refactor

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RimClone.sln

      - name: Build
        run: dotnet build RimClone.sln --configuration Release --no-restore

      - name: Publish portable Windows build
        shell: pwsh
        run: ./publish-windows.ps1

      - name: Archive portable Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "RimClone-win-x64.zip" -Force

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RimClone-win-x64
          path: RimClone-win-x64.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Run simulation self-tests
        run: dotnet run --project App/App.csproj --configuration Release --no-build -- --self-test

      - name: Run Behaviac .NET 10 compatibility probe
        run: dotnet run --project Experiments/Behaviac/Behaviac.Probe.csproj --configuration Release
      - name: Run Behaviac unit-intent decision tests
        run: dotnet run --project Experiments/Behaviac/Behaviac.Probe.csproj --configuration Release -- --decision-test
